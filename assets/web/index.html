<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Veem</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    #veem-root {
      width: 100%;
      min-height: 100%;
      box-sizing: border-box;
      padding: 16px;
    }
    .veem-bridge-error {
      padding: 24px 16px;
      color: #b6353b;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="veem-root"></div>

  <script>
    /* ====================================================================
     * Veem Flutter SDK — WebView bridge
     *
     * This page is bundled inside the veem_flutter package and loaded into
     * a Flutter WebView. It:
     *   1. Reads injected config (substituted by Flutter at load time)
     *   2. Loads the Veem Web SDK from unpkg.com
     *   3. Instantiates Veem.WebSDK with the right plugin name + config
     *   4. Forwards onComplete / onExit / onError back to Flutter via the
     *      VeemHost JavaScriptChannel
     *
     * Template slots replaced by Dart (see VeemWebView._buildHtml):
     *   {{VEEM_WEBSDK_VERSION}}  -> "0" or "0.x.y"
     *   {{VEEM_ENV}}             -> "sandbox" | "production"
     *   {{VEEM_CLIENT_ID}}       -> "<client-id>"
     *   {{VEEM_PLUGIN_NAME}}     -> "collectAccountInformation" | ...
     *   {{VEEM_PLUGIN_CONFIG}}   -> { referenceId, preset?, configuration }
     *   {{VEEM_ENABLE_LOGGING}}  -> true | false
     * ====================================================================
     */

    (function() {
      'use strict';

      var CONFIG = {
        sdkVersion: {{VEEM_WEBSDK_VERSION}},
        environment: {{VEEM_ENV}},
        clientId: {{VEEM_CLIENT_ID}},
        pluginName: {{VEEM_PLUGIN_NAME}},
        pluginConfig: {{VEEM_PLUGIN_CONFIG}},
        enableLogging: {{VEEM_ENABLE_LOGGING}}
      };

      function log() {
        if (!CONFIG.enableLogging) return;
        try {
          var args = Array.prototype.slice.call(arguments);
          console.log.apply(console, ['[veem-bridge]'].concat(args));
        } catch (_) { /* ignore */ }
      }

      function postToFlutter(type, payload) {
        try {
          if (window.VeemHost && typeof window.VeemHost.postMessage === 'function') {
            window.VeemHost.postMessage(JSON.stringify({
              type: type,
              payload: payload || {}
            }));
          } else {
            log('VeemHost channel not available; dropping event', type);
          }
        } catch (e) {
          // Avoid throwing out of the bridge — the WebView is the only
          // observer and there's nowhere useful to surface this.
          try { console.error('[veem-bridge] post failed', e); } catch (_) {}
        }
      }

      function showInlineError(message) {
        var root = document.getElementById('veem-root');
        if (!root) return;
        var div = document.createElement('div');
        div.className = 'veem-bridge-error';
        div.textContent = message;
        root.innerHTML = '';
        root.appendChild(div);
      }

      function loadSdk(onReady) {
        var script = document.createElement('script');
        script.src = 'https://unpkg.com/veem-web-sdk@' + CONFIG.sdkVersion + '/umd/index.min.js';
        script.async = false;
        script.onload = function() {
          log('Web SDK loaded');
          onReady();
        };
        script.onerror = function() {
          var msg = 'Failed to load Veem Web SDK from unpkg (version "' +
                    CONFIG.sdkVersion + '"). Check device network connectivity.';
          showInlineError(msg);
          postToFlutter('error', {
            code: 'networkError',
            message: msg
          });
        };
        document.head.appendChild(script);
      }

      function resolveSdkGlobal() {
        // The Veem Web SDK docs use `new Veem.WebSDK(...)`, so we expect
        // a `Veem` global with a `WebSDK` constructor.
        if (typeof window.Veem !== 'undefined' &&
            typeof window.Veem.WebSDK === 'function') {
          return window.Veem.WebSDK;
        }
        return null;
      }

      function mountPlugin() {
        var SdkCtor = resolveSdkGlobal();
        if (!SdkCtor) {
          var msg = 'Veem Web SDK loaded but window.Veem.WebSDK is not a constructor. ' +
                    'The Web SDK version may have an incompatible export shape.';
          showInlineError(msg);
          postToFlutter('error', {
            code: 'bridgeError',
            message: msg
          });
          return;
        }

        // Merge clientId (from VeemConfig) into the per-plugin
        // configuration. The Dart side intentionally doesn't know clientId
        // when building the plugin config — we attach it here.
        var pluginCfg = CONFIG.pluginConfig || {};
        var configuration = Object.assign(
          {},
          pluginCfg.configuration || {},
          { clientId: CONFIG.clientId }
        );

        var args = {
          name: CONFIG.pluginName,
          environment: CONFIG.environment,
          target: '#veem-root',
          referenceId: pluginCfg.referenceId,
          configuration: configuration,
          onComplete: function(payload) {
            log('onComplete', payload);
            postToFlutter('complete', payload || {});
          },
          onExit: function() {
            log('onExit');
            postToFlutter('exit', {});
          },
          onError: function(err) {
            log('onError', err);
            postToFlutter('error', {
              code: 'pluginError',
              message: (err && (err.message || err.toString())) || 'Card plugin error',
              details: serializeError(err)
            });
          }
        };

        if (pluginCfg.preset) {
          args.preset = pluginCfg.preset;
        }

        try {
          // Signal that the plugin is mounting. The actual ready state
          // (Web SDK fully rendered) isn't surfaced by the Web SDK in v1
          // — Flutter treats page load as ready.
          postToFlutter('ready', {});
          // eslint-disable-next-line no-new
          new SdkCtor(args);
        } catch (e) {
          var failureMsg = 'Failed to instantiate Veem Web SDK: ' +
                           (e && e.message ? e.message : String(e));
          showInlineError(failureMsg);
          postToFlutter('error', {
            code: 'bridgeError',
            message: failureMsg,
            details: serializeError(e)
          });
        }
      }

      function serializeError(err) {
        if (!err) return null;
        if (typeof err === 'string') return { message: err };
        var out = {};
        try {
          if (err.message) out.message = err.message;
          if (err.name) out.name = err.name;
          if (err.code) out.code = err.code;
          // Pull through any own enumerable props the Web SDK attaches.
          for (var k in err) {
            if (Object.prototype.hasOwnProperty.call(err, k) && !(k in out)) {
              try { out[k] = err[k]; } catch (_) {}
            }
          }
        } catch (_) {}
        return out;
      }

      // Boot
      log('boot', CONFIG.pluginName, CONFIG.environment);
      loadSdk(mountPlugin);
    })();
  </script>
</body>
</html>
